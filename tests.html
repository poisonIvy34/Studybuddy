<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyBuddy rule checks</title>
<style>
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 16px; color: #1b1b1b; background: #fff; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 4px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
  .r { margin: 1px 0; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .pass { color: #176f2c; } .fail { color: #b3141b; font-weight: 600; }
  #summary { font-weight: 700; font-size: 16px; margin: 8px 0 12px; }
</style>
</head>
<body>
<h1>StudyBuddy — rule checks</h1>
<div id="summary">Running…</div>
<div id="out"></div>

<script src="js/data.js"></script>
<script src="js/clock.js"></script>
<script src="js/rules.js"></script>
<script>
(function () {
  "use strict";
  var R = SB.rules, C = SB.clock;
  var out = document.getElementById("out");
  var passed = 0, failed = 0;

  function section(name) { var h = document.createElement("h2"); h.textContent = name; out.appendChild(h); }
  function check(name, cond, detail) {
    var d = document.createElement("div");
    d.className = "r " + (cond ? "pass" : "fail");
    d.textContent = (cond ? "PASS " : "FAIL ") + name + (!cond && detail !== undefined ? "  —  " + detail : "");
    out.appendChild(d);
    if (cond) passed++; else failed++;
  }
  function eq(name, actual, expected) {
    var a = JSON.stringify(actual), e = JSON.stringify(expected);
    check(name, a === e, "got " + a + ", expected " + e);
  }
  function safe(name, fn) {
    try { fn(); } catch (e) { check(name + " (threw)", false, e && e.stack ? e.stack : String(e)); }
  }
  function copy(x) { return JSON.parse(JSON.stringify(x)); }
  function byId(arr, id) { return arr.filter(function (x) { return x.id === id; })[0]; }
  function T(s) { return "2026-11-" + s + ":00-07:00"; }
  function addM(iso, m) { return C.add(iso, { minutes: m }); }
  function run(r) { if (r.error) throw new Error("unexpected rule error: " + r.error); return r.state; }

  // ---------- fixtures ----------
  // A small world: 1 course, 1 exam on Nov 20, 12 finished students, now = Nov 10 09:00.
  function fixture(nStudents) {
    var st = copy(SB.seed);
    st.seq = 0;
    st.jobs = { surveyOpenSent: false };
    st.demo = { now: T("10T09:00"), currentUserId: null, location: "in_range", pendingLinkCode: null };
    st.settings.pilotEnd = T("30T12:00");
    st.courses = [{ id: "crs_x", name: "TEST 101: Fixture", section: "001", linkCode: "test-001", enrolled: 50 }];
    st.exams = [{ id: "exm_x", courseId: "crs_x", name: "Exam", at: T("20T10:00") }];
    st.slots = []; st.students = []; st.picks = []; st.sessions = []; st.seats = []; st.checkins = [];
    st.misses = []; st.reports = []; st.postAnswers = []; st.surveyAnswers = []; st.notifications = [];
    for (var i = 1; i <= (nStudents || 12); i++) {
      st.students.push({ id: "stu_" + i, email: "s" + i + "@byu.edu", firstName: "S" + i, year: "Junior", vibe: "quiet",
        courseIds: ["crs_x"], onboarding: { profile: true, conduct: true, intake: true, permissions: true } });
    }
    return st;
  }
  // Slot starting at `start` (90 minutes long).
  function addSlot(st, id, start, opts) {
    opts = opts || {};
    st.slots.push({ id: id, examId: opts.examId || "exm_x", start: start, end: addM(start, 90), place: "HBLL",
      spots: opts.spots || ["t1", "t2", "t3"], vibe: opts.vibe || "quiet", status: "open", jobs: { lockDone: false } });
  }
  // Picks by students 1..n (or a list), one minute apart starting Nov 9 00:00.
  function addPicks(st, slotId, who) {
    if (typeof who === "number") { var n = who; who = []; for (var i = 1; i <= n; i++) who.push(i); }
    who.forEach(function (i, k) {
      st.picks.push({ id: "pck_" + slotId + "_" + i, slotId: slotId, studentId: "stu_" + i,
        at: C.add(T("09T00:00"), { minutes: k }), status: "active", removedReason: null });
    });
  }
  function seatsOf(st, slotId, studentId) {
    var ses = st.sessions.filter(function (s) { return s.slotId === slotId; }).map(function (s) { return s.id; });
    return st.seats.filter(function (x) { return ses.indexOf(x.sessionId) >= 0 && (!studentId || x.studentId === studentId); });
  }
  function seatOf(st, slotId, studentId) { return seatsOf(st, slotId, studentId)[0]; }
  function notes(st, kind, to) {
    return st.notifications.filter(function (n) { return n.kind === kind && (!to || n.to === to); });
  }
  // A locked one-table session: slot "slt_s" at Nov 12 16:00 with students 1..n placed. Returns state at Nov 12 09:00.
  var S_START = T("12T16:00"), S_END = T("12T17:30");
  function lockedFixture(n) {
    var st = fixture();
    addSlot(st, "slt_s", S_START);
    addPicks(st, "slt_s", n || 4);
    return R.tick(st, T("12T09:00"));
  }
  function sid(st, i) { return seatOf(st, "slt_s", "stu_" + i).id; }

  // ================= SEED =================
  section("Seed shape and consistency");
  safe("seed", function () {
    var s = SB.seed;
    check("seed has version 2 and every top-level field", s.version === 2 && ["seq", "jobs", "demo", "settings", "admins",
      "courses", "exams", "slots", "conductText", "surveys", "students", "picks", "sessions", "seats", "checkins", "misses",
      "reports", "postAnswers", "surveyAnswers", "notifications"].every(function (k) { return k in s; }));
    eq("demo.currentUserId and pendingLinkCode are null", [s.demo.currentUserId, s.demo.pendingLinkCode], [null, null]);
    check("2-3 courses, each with 2 exams", s.courses.length >= 2 && s.courses.length <= 3 && s.courses.every(function (c) {
      return s.exams.filter(function (e) { return e.courseId === c.id; }).length === 2; }));
    check("about 15 students (14-16)", s.students.length >= 14 && s.students.length <= 16, s.students.length);
    eq("both admins, @byu.edu", s.admins.map(function (a) { return /@byu\.edu$/.test(a.email); }), [true, true]);

    // every time is November 2026 with -07:00
    var bad = [];
    (function walk(o, path) {
      if (typeof o === "string") {
        if (/^\d{4}-\d\d-\d\dT/.test(o) && !/^2026-11-\d\dT\d\d:\d\d:\d\d-07:00$/.test(o)) bad.push(path + "=" + o);
      } else if (o && typeof o === "object") Object.keys(o).forEach(function (k) { walk(o[k], path + "." + k); });
    })(s, "seed");
    check("every seeded time is in November 2026 at -07:00", bad.length === 0, bad.join(", "));

    var prefixes = { students: "stu_", admins: "adm_", courses: "crs_", exams: "exm_", slots: "slt_", picks: "pck_",
      sessions: "ses_", seats: "set_", checkins: "chk_", misses: "mis_", reports: "rpt_", notifications: "ntf_" };
    var badIds = [], allIds = {};
    Object.keys(prefixes).forEach(function (k) {
      s[k].forEach(function (r) {
        if (r.id.indexOf(prefixes[k]) !== 0) badIds.push(r.id);
        if (allIds[r.id]) badIds.push("dup " + r.id);
        allIds[r.id] = true;
      });
    });
    check("every ID has its prefix and is unique", badIds.length === 0, badIds.join(", "));
    var maxNum = 0;
    Object.keys(allIds).forEach(function (id) { var m = /^[a-z]+_(\d+)$/.exec(id); if (m) maxNum = Math.max(maxNum, +m[1]); });
    check("seq is above every seeded number", s.seq > maxNum, "seq " + s.seq + ", max " + maxNum);

    check("every attended seat has a valid check-in", s.seats.filter(function (x) { return x.status === "attended"; })
      .every(function (x) { return s.checkins.some(function (c) { return c.seatId === x.id && (c.result === "in_range" || c.result === "unverified"); }); }));
    check("every no_show seat has a miss (or a removed one)", s.seats.filter(function (x) { return x.status === "no_show"; })
      .every(function (x) { return s.misses.some(function (k) { return k.seatId === x.id; }); }));
    check("every placed pick has a seat", s.picks.filter(function (p) { return p.status === "placed"; }).every(function (p) {
      return seatsOf(s, p.slotId, p.studentId).length === 1; }));
    check("every seat has a placed pick", s.seats.every(function (x) {
      var ses = byId(s.sessions, x.sessionId);
      return s.picks.some(function (p) { return p.slotId === ses.slotId && p.studentId === x.studentId && p.status === "placed"; });
    }));
    check("dropped slots have only not_placed picks, open slots only active/removed",
      s.slots.every(function (sl) {
        var ps = s.picks.filter(function (p) { return p.slotId === sl.id; });
        if (sl.status === "dropped") return ps.every(function (p) { return p.status === "not_placed"; });
        if (sl.status === "open") return ps.every(function (p) { return p.status === "active" || p.status === "removed"; });
        return ps.every(function (p) { return p.status === "placed"; });
      }));
    check("references resolve (seats, check-ins, misses, post answers)",
      s.seats.every(function (x) { return byId(s.sessions, x.sessionId) && byId(s.students, x.studentId); }) &&
      s.checkins.every(function (c) { return byId(s.seats, c.seatId); }) &&
      s.misses.every(function (k) { return byId(s.seats, k.seatId) && byId(s.students, k.studentId) && byId(s.exams, k.examId); }) &&
      s.postAnswers.every(function (a) { return byId(s.seats, a.seatId); }));
    check("one question per survey has isConnection", ["intake", "exit"].every(function (k) {
      return s.surveys[k].filter(function (q) { return q.isConnection; }).length === 1; }));

    // the jobs flags match demo.now: ticking to "now" changes nothing
    var ticked = R.tick(s, s.demo.now);
    eq("seed jobs flags match demo.now (tick to now is a no-op)", ticked, s);

    // seed requirements
    var now = C.toMs(s.demo.now), H = 3600000;
    function picksOn(id, st) { return s.picks.filter(function (p) { return p.slotId === id && p.status === (st || "active"); }).length; }
    var open49 = s.slots.filter(function (sl) { var d = (C.toMs(sl.start) - now) / H; return sl.status === "open" && d > 48 && d <= 50; });
    check("an open slot ~49h out with 3+ picks", open49.some(function (sl) { return picksOn(sl.id) >= 3; }));
    check("an open slot ~49h out with 2 picks", open49.some(function (sl) { return picksOn(sl.id) === 2; }));
    check("an open slot with 7+ picks", s.slots.some(function (sl) { return sl.status === "open" && picksOn(sl.id) >= 7; }));
    var low = s.sessions.filter(function (ses) {
      var sl = byId(s.slots, ses.slotId), d = (C.toMs(sl.start) - now) / H;
      var still = s.seats.filter(function (x) { return x.sessionId === ses.id && (x.status === "placed" || x.status === "confirmed"); }).length;
      return d > 3 && d <= 5 && still === 2;
    });
    check("a locked session ~4h out with 2 students", low.length === 1);
    check("...which locked with 3+ and the others cancelled", low.length === 1 && (function () {
      var all = s.seats.filter(function (x) { return x.sessionId === low[0].id; });
      return all.length >= 3 && all.filter(function (x) { return x.status === "cancelled"; }).length === all.length - 2;
    })());
    var counts = {};
    s.misses.forEach(function (k) { if (!k.removed) counts[k.studentId] = (counts[k.studentId] || 0) + 1; });
    var vals = Object.keys(counts).map(function (k) { return counts[k]; });
    check("one student with 1 miss and one with 2", vals.indexOf(1) >= 0 && vals.indexOf(2) >= 0, JSON.stringify(counts));
    check("every studiedWith names a tablemate", s.postAnswers.every(function (a) {
      var by = byId(s.seats, a.seatId);
      return (a.studiedWith || []).every(function (id) {
        return id !== by.studentId && s.seats.some(function (x) { return x.sessionId === by.sessionId && x.studentId === id; }); });
    }));
    check("an unverified check-in waiting for review", s.checkins.some(function (c) { return c.result === "unverified" && c.adminDecision === null; }));
    check("some sessions are in the past", s.sessions.some(function (ses) { return C.toMs(byId(s.slots, ses.slotId).end) < now; }));
  });

  section("No coordinates, ever");
  safe("coords", function () {
    var COORD = /^(lat|lng|lon|long|latitude|longitude|coords?|coordinates|geo|position|accuracy|gps)$/i;
    function coordKeys(o) {
      var found = [];
      (function walk(x, path) {
        if (x && typeof x === "object") Object.keys(x).forEach(function (k) {
          if (COORD.test(k)) found.push(path + "." + k);
          walk(x[k], path + "." + k);
        });
      })(o, "state");
      return found;
    }
    eq("seed has no coordinate fields", coordKeys(SB.seed), []);
    var st = lockedFixture(3);
    st = R.tick(st, addM(S_START, -30));
    st = run(R.confirm(st, addM(S_START, -30), "stu_1", sid(st, 1)));
    st.demo.location = "in_range"; st = run(R.checkIn(st, addM(S_START, -10), "stu_1", sid(st, 1)));
    st.demo.location = "denied"; st = run(R.checkIn(st, addM(S_START, -10), "stu_2", sid(st, 2)));
    st.demo.location = "out_of_range"; st = run(R.checkIn(st, addM(S_START, -10), "stu_3", sid(st, 3)));
    eq("check-in records hold only id, seatId, at, result, adminDecision",
      st.checkins.map(function (c) { return Object.keys(c).sort().join(","); }),
      ["adminDecision,at,id,result,seatId", "adminDecision,at,id,result,seatId", "adminDecision,at,id,result,seatId"]);
    eq("state after check-ins has no coordinate fields", coordKeys(st), []);
  });

  // ================= CLOCK =================
  section("Clock (Mountain Time)");
  safe("clock", function () {
    eq("fromMs uses -06:00 before Nov 1, 2026", C.fromMs(Date.UTC(2026, 9, 31, 18, 0, 0)), "2026-10-31T12:00:00-06:00");
    eq("fromMs uses -07:00 from Nov 1, 2026", C.fromMs(Date.UTC(2026, 10, 17, 23, 0, 0)), "2026-11-17T16:00:00-07:00");
    eq("toMs/fromMs round-trip", C.fromMs(C.toMs("2026-11-16T12:00:00-07:00")), "2026-11-16T12:00:00-07:00");
    eq("add minutes and hours", [C.add(T("16T12:00"), { minutes: -15 }), C.add(T("16T12:00"), { hours: -48 })],
      [T("16T11:45"), T("14T12:00")]);
    eq("add days keeps MT wall time across DST", C.add("2026-10-30T10:00:00-06:00", { days: 14 }), "2026-11-13T10:00:00-07:00");
    eq("fmt time / day / dayTime", [C.fmt(T("16T16:00"), "time"), C.fmt(T("16T16:00"), "day"), C.fmt(T("16T16:00"), "dayTime")],
      ["4:00 PM", "Mon, Nov 16", "Mon, Nov 16 · 4:00 PM"]);
    check("fmt full includes the date and year", /November 16, 2026/.test(C.fmt(T("16T09:05"), "full")) && /9:05 AM/.test(C.fmt(T("16T09:05"), "full")));
    eq("fmt handles midnight and noon", [C.fmt(T("16T00:00"), "time"), C.fmt(T("16T12:30"), "time")], ["12:00 AM", "12:30 PM"]);
  });

  // ================= IDS / PURITY =================
  section("IDs and purity");
  safe("ids", function () {
    var st = { seq: 56 };
    eq("nextId increments seq and returns prefix + seq", [R.nextId(st, "ntf_"), st.seq, R.nextId(st, "pck_")], ["ntf_57", 57, "pck_58"]);
    var seedBefore = JSON.stringify(SB.seed);
    R.tick(SB.seed, T("30T23:00"));
    R.metrics(SB.seed);
    R.examsFor(SB.seed, SB.seed.demo.now, "stu_maya");
    R.pick(SB.seed, SB.seed.demo.now, "stu_priya", "slt_stat121_m2_wed");
    check("tick, metrics, examsFor and transitions never change their input", JSON.stringify(SB.seed) === seedBefore);
  });

  // ================= LOCK =================
  section("Lock: form tables or drop");
  safe("lock3", function () {
    var st = fixture(); addSlot(st, "slt_a", T("12T16:00")); addPicks(st, "slt_a", 3);
    var before = R.tick(st, T("10T15:59"));
    eq("nothing locks before T-48h", byId(before.slots, "slt_a").status, "open");
    var s2 = R.tick(st, T("10T16:00"));
    eq("lock with 3: slot locked, 1 table", [byId(s2.slots, "slt_a").status, s2.sessions.length], ["locked", 1]);
    eq("lock with 3: all picks placed, 3 placed seats", [s2.picks.map(function (p) { return p.status; }),
      s2.seats.map(function (x) { return x.status; })], [["placed", "placed", "placed"], ["placed", "placed", "placed"]]);
    eq("lock with 3: table 1 gets the first spot", s2.sessions[0].spot, "t1");
    var conf = notes(s2, "session_confirmed");
    eq("lock with 3: session_confirmed to each placed student", conf.map(function (n) { return n.to; }), ["stu_1", "stu_2", "stu_3"]);
    check("session_confirmed names the time, spot and tablemates' first names",
      /Thu, Nov 12 · 4:00 PM/.test(conf[0].text) && /t1/.test(conf[0].text) && /S2, S3/.test(conf[0].text) && !/@/.test(conf[0].text), conf[0].text);
    eq("session_confirmed routes to the session", conf[0].route, "#/session/" + s2.sessions[0].id);
    eq("lock happens at T-48h exactly (notification time)", conf[0].at, T("10T16:00"));
  });
  safe("lock8", function () {
    var st = fixture(); addSlot(st, "slt_a", T("12T16:00"), { spots: ["t1", "t2"] }); addPicks(st, "slt_a", 8);
    st = R.tick(st, T("10T16:00"));
    eq("lock with 8: two tables of 4 (TC5)", st.sessions.map(function (s) { return st.seats.filter(function (x) { return x.sessionId === s.id; }).length; }), [4, 4]);
    eq("D30: table 1 is the first 4 by pick time", st.seats.filter(function (x) { return x.sessionId === st.sessions[0].id; })
      .map(function (x) { return x.studentId; }), ["stu_1", "stu_2", "stu_3", "stu_4"]);
    eq("tables get spots in order", st.sessions.map(function (s) { return [s.table, s.spot]; }), [[1, "t1"], [2, "t2"]]);
    eq("tablemates in confirmation are own table only", notes(st, "session_confirmed", "stu_5")[0].text.indexOf("S1") < 0, true);
  });
  safe("lockSizes", function () {
    function sizes(n) {
      var st = fixture(20); addSlot(st, "slt_a", T("12T16:00"), { spots: ["a", "b", "c", "d"] }); addPicks(st, "slt_a", n);
      st = R.tick(st, T("10T16:00"));
      return st.sessions.map(function (s) { return st.seats.filter(function (x) { return x.sessionId === s.id; }).length; });
    }
    eq("D30: 6 -> [6], 7 -> [4,3], 13 -> [5,4,4], 12 -> [6,6]", [sizes(6), sizes(7), sizes(13), sizes(12)], [[6], [4, 3], [5, 4, 4], [6, 6]]);
  });
  safe("lockOrder", function () {
    var st = fixture(); addSlot(st, "slt_a", T("12T16:00")); addPicks(st, "slt_a", [5, 3, 1, 2, 4, 6, 7]);
    // make stu_7 the earliest picker, and break a tie by pick ID
    st.picks[6].at = T("08T00:00");
    st.picks[1].at = st.picks[0].at; // stu_3 ties stu_5; pck_slt_a_3 < pck_slt_a_5
    st = R.tick(st, T("10T16:00"));
    eq("D30: sorted by pick time, ties by pick ID", st.seats.filter(function (x) { return x.sessionId === st.sessions[0].id; })
      .map(function (x) { return x.studentId; }), ["stu_7", "stu_3", "stu_5", "stu_1"]);
  });
  safe("D31", function () {
    var st = fixture(); addSlot(st, "slt_a", T("12T16:00"), { spots: ["only"] }); addPicks(st, "slt_a", 8);
    st = R.tick(st, T("10T16:00"));
    eq("D31: extra table forms with spot \"To be announced\"", st.sessions.map(function (s) { return s.spot; }), ["only", "To be announced"]);
    var o = notes(st, "out_of_spots");
    eq("D31: out_of_spots goes to admin once", [o.length, o[0] && o[0].to, o[0] && o[0].slotId], [1, "admin", "slt_a"]);
  });
  safe("drop", function () {
    var st = fixture();
    addSlot(st, "slt_drop", T("12T16:00"));
    addSlot(st, "slt_pop", T("13T16:00"));   // 3 picks
    addSlot(st, "slt_mid", T("13T18:00"));   // 2 picks
    addSlot(st, "slt_early", T("13T12:00")); // 2 picks, earlier than slt_mid
    addSlot(st, "slt_other", T("13T10:00"), { examId: "exm_other" });
    st.exams.push({ id: "exm_other", courseId: "crs_x", name: "Other", at: T("20T10:00") });
    addPicks(st, "slt_other", [7, 8, 9, 10, 11]);
    addPicks(st, "slt_drop", [1, 2]);
    addPicks(st, "slt_pop", [2, 5, 6]);
    addPicks(st, "slt_mid", [3, 4]);
    addPicks(st, "slt_early", [3, 4]);
    st = R.tick(st, T("10T16:00"));
    eq("drop with 2: slot dropped, no sessions", [byId(st.slots, "slt_drop").status, st.sessions.length], ["dropped", 0]);
    eq("drop with 2: picks become not_placed", st.picks.filter(function (p) { return p.slotId === "slt_drop"; }).map(function (p) { return p.status; }), ["not_placed", "not_placed"]);
    var d = notes(st, "slot_dropped");
    eq("each picker is told", d.map(function (n) { return n.to; }), ["stu_1", "stu_2"]);
    eq("suggestion = most popular open slot for the same exam", d[0].suggestedSlotId, "slt_pop");
    eq("D21: student who already picked it gets the next most popular (ties: earliest start)", d[1].suggestedSlotId, "slt_early");
    check("drop message names the suggested slot", /Fri, Nov 13 · 4:00 PM/.test(d[0].text), d[0].text);
    eq("D4: the suggestion is never picked automatically", st.picks.filter(function (p) { return p.studentId === "stu_1" && p.status === "active"; }).length, 0);
    var r = R.pick(st, T("10T16:05"), "stu_1", d[0].suggestedSlotId);
    check("D4: one tap picks the suggestion", !r.error && r.state.picks.some(function (p) { return p.studentId === "stu_1" && p.slotId === "slt_pop" && p.status === "active"; }));

    var st2 = fixture(); addSlot(st2, "slt_drop", T("12T16:00")); addPicks(st2, "slt_drop", [1, 2]);

  section("Metrics vs hand-computed seed values");
  safe("metrics", function () {
    var got = R.metrics(SB.seed), exp = SB.seedExpectedMetrics;
    function close(a, b) { return a === b || (a !== null && b !== null && Math.abs(a - b) < 1e-9); }
    function cmp(label, g, e) {
      if (e === null) { eq(label + " is null", g, null); return; }
      check(label + " = " + e.num + "/" + e.den, g && g.num === e.num && g.den === e.den && close(g.value, e.value), JSON.stringify(g));
    }
    var names = ["signupConversion", "matchRate", "showUpRate", "repeatUse", "betterPrepared", "connection", "noShowRate", "nps"];
    names.forEach(function (k) { cmp("overall " + k, got.overall[k], exp.overall[k]); });
    Object.keys(exp.byCourse).forEach(function (cid) {
      names.forEach(function (k) { cmp(cid + " " + k, got.byCourse[cid] && got.byCourse[cid][k], exp.byCourse[cid][k]); });
    });
    eq("byCourse has one row per course", Object.keys(got.byCourse).sort(), SB.seed.courses.map(function (c) { return c.id; }).sort());
  });

    check("students can't edit slots", !!R.saveSlot(s, s.demo.now, "stu_maya", { examId: "exm_stat121_m2", start: far.start, end: far.end, place: "x", spots: [], vibe: "quiet" }).error);
    var c = R.saveCourse(s, s.demo.now, "adm_ash", { name: "PSYCH 111", section: "001", linkCode: "psych111-001", enrolled: 200 });
    check("saveCourse creates a course", !c.error && c.state.courses.length === 3);
    check("link codes are unique", !!R.saveCourse(s, s.demo.now, "adm_ash", { name: "X", section: "1", linkCode: "stat121-003", enrolled: 1 }).error);
  });
  safe("markRead", function () {
    var s = SB.seed;
    var n = s.notifications.filter(function (x) { return x.to === "stu_tyler" && !x.read; })[0];
    var r = run(R.markRead(s, s.demo.now, "stu_tyler", n.id));
    check("markRead marks own notification read", byId(r.notifications, n.id).read === true);
    check("can't mark someone else's", !!R.markRead(s, s.demo.now, "stu_maya", n.id).error);
    var a = R.tick(s, T("16T13:00"));
    var lt = notes(a, "low_turnout")[0];
    var rr = run(R.markRead(a, T("16T13:00"), "adm_ash", lt.id));
    check("admins share one read flag on admin notifications", byId(rr.notifications, lt.id).read === true);
  });

  // ---------- summary ----------
  var sum = document.getElementById("summary");
  sum.textContent = "PASSED " + passed + " / FAILED " + failed;
  sum.className = failed ? "fail" : "pass";
  document.title = (failed ? "FAIL " : "PASS ") + passed + "/" + (passed + failed) + " — StudyBuddy rule checks";
})();
</script>
</body>
